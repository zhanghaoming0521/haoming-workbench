<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千川全域投放日报</title>
<style>
  :root{
    --blue:#3370ff; --blue-soft:#eaf1ff; --text:#1d2129; --sub:#646a73; --tertiary:#8f959e;
    --line:#e5e6eb; --bg:#f7f8fa; --card:#ffffff; --green:#00b42a; --red:#f53f3f; --amber:#ff7d00;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:40px 24px;}
  .wrap{max-width:1120px;margin:0 auto;}
  header{margin-bottom:22px;}
  h1{font-size:22px;font-weight:600;display:flex;align-items:center;gap:12px;}
  h1 .dot{width:8px;height:22px;background:var(--blue);border-radius:3px;display:inline-block;}
  .sub{color:var(--sub);font-size:13.5px;margin-top:8px;}
  .note{margin-top:6px;color:var(--tertiary);font-size:12.5px;}

  /* 顶部日期选择区 */
  .datebar{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .datebar .dlabel{font-size:13px;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:7px;}
  .datebar .dlabel .cal{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block;}
  .date-group{display:flex;gap:8px;flex-wrap:wrap;}
  .date-btn{border:1px solid var(--line);background:#fafbfc;color:var(--sub);border-radius:10px;padding:7px 16px;font-size:13px;cursor:pointer;transition:.15s;line-height:1.35;text-align:center;}
  .date-btn .dnum{font-weight:600;font-size:14px;color:var(--text);display:block;}
  .date-btn .dwk{font-size:11px;color:var(--tertiary);display:block;margin-top:1px;}
  .date-btn:hover{border-color:var(--blue);}
  .date-btn.active{background:var(--blue);border-color:var(--blue);}
  .date-btn.active .dnum,.date-btn.active .dwk{color:#fff;}

  /* 板块通用 */
  .board{margin-bottom:26px;}
  .board-hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .board-hd h2{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px;}
  .board-hd h2 .bar{width:4px;height:16px;background:var(--blue);border-radius:2px;display:inline-block;}
  .spacer{flex:1;}

  /* 板块1 汇总（横向铺开） */
  .sum-hero{margin-bottom:16px;}
  .sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .sum-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;}
  .sum-card.primary{border-color:#c7d8ff;background:linear-gradient(180deg,#f6f9ff 0%,#ffffff 60%);}
  .sum-card.hero{border-color:#b8ccff;box-shadow:0 4px 16px rgba(51,112,255,.08);}
  .sum-hd{font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .sum-hd .pin{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block;}
  .sum-card.live .sum-hd .pin{background:#d54941;}
  .sum-card.brand .sum-hd .pin{background:#8e44ad;}
  .kpi-row{display:flex;gap:10px;flex-wrap:wrap;}
  .kpi{flex:1;min-width:88px;padding:10px 12px;border-radius:12px;background:#fafbfc;border:1px solid #f0f1f3;}
  .sum-card.hero .kpi{background:#fff;border-color:#eef1f6;}
  .kpi .k{font-size:12px;color:var(--sub);margin-bottom:5px;}
  .kpi .mval{font-size:17px;font-weight:600;letter-spacing:-0.2px;}
  .kpi .mchg{font-size:11px;font-weight:600;margin-top:3px;}

  /* 板块2 分段按钮 + 批量按钮 */
  .seg{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:9px;padding:6px 16px;font-size:13px;cursor:pointer;transition:.15s;}
  .seg:hover{border-color:var(--blue);color:var(--blue);}
  .seg.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .seggroup{display:flex;gap:8px;}
  .batch{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:9px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s;}
  .batch:hover{border-color:var(--blue);color:var(--blue);}

  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 4px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:right;padding:12px 16px;border-bottom:1px solid #f2f3f5;font-size:14px;white-space:nowrap;vertical-align:middle;}
  .txt{text-align:left;}
  th{color:var(--sub);font-weight:500;cursor:pointer;user-select:none;background:#fafbfc;}
  th:hover{color:var(--blue);}
  th.txt,td.txt{padding-left:20px;}

  /* 消耗 + 环比（环比在消耗下方） */
  .mval{font-weight:600;letter-spacing:-0.2px;}
  .mchg{font-size:11.5px;font-weight:600;margin-top:2px;}
  .up{color:var(--red);} .down{color:var(--green);} .flat{color:var(--tertiary);}

  tbody tr.shop-row:hover{background:#fafbfc;}
  .shop-row{cursor:pointer;}
  .shop-row .chev,.acct-row .chev{display:inline-block;transition:transform .15s;color:var(--tertiary);margin-right:2px;}
  .shop-row.open .chev,.acct-row.open .chev{transform:rotate(90deg);}
  .shop-row td:first-child{font-weight:500;}

  /* 展开：账户明细 */
  tr.detail-row>td{background:#fcfdff;padding:0 12px 12px 12px;}
  .detail-inner{padding:8px 0 2px 20px;border-left:2px solid var(--blue-soft);margin:2px 0 4px;}
  .detail-tbl{width:100%;}
  .detail-tbl th{background:transparent;cursor:default;color:var(--tertiary);font-size:12.5px;padding:6px 12px;}
  .detail-tbl th:hover{color:var(--tertiary);}
  .detail-tbl td{font-size:13px;padding:9px 12px;border-bottom:1px solid #f4f5f7;}
  .acct-row.expandable{cursor:pointer;}
  .acct-row.expandable:hover{background:#f7faff;}
  /* 二级：板块拆分行 */
  .sec-row td{background:#f8fafd;font-size:12.5px;padding:7px 12px;}
  .sec-row td:first-child{padding-left:30px;}

  .tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:11px;background:var(--blue-soft);color:var(--blue);}
  .tag.live{background:#fdeaf0;color:#d54941;}
  .tag.brand{background:#f3e9f7;color:#8e44ad;}
  .tag.sm{font-size:11px;padding:1px 8px;}
  .shop-cell{display:inline-block;vertical-align:middle;}
  .shop-name{font-weight:500;}
  .shop-tags{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;}
  .acct-cell{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;vertical-align:middle;}
  .acct-name{font-weight:500;}
  .acct-tags{display:flex;gap:6px;}
  .bar-wrap{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .bar{height:6px;border-radius:3px;background:var(--blue);display:inline-block;min-width:6px;}
  .bar-wrap .pct{color:var(--tertiary);font-size:12.5px;min-width:44px;text-align:right;}

  .foot{color:var(--tertiary);font-size:12px;text-align:center;margin-top:16px;line-height:1.9;}
  /* 跨日对比面板 */
  .trend td{text-align:left;vertical-align:top;}
  .trend .mval{font-size:15px;}
  .trend .mlabel{font-weight:600;color:var(--text);}
  .trend .curcol{background:#f5f8ff;}
  /* 合计行 */
  .total-row td{background:#f4f7ff;font-weight:600;border-top:2px solid var(--line);}
  .total-row:hover td{background:#f4f7ff;}
  /* 品牌口径提示 */
  .hint{font-size:11px;font-weight:400;color:var(--tertiary);margin-left:6px;vertical-align:middle;}
  @media(max-width:820px){.sumgrid{grid-template-columns:1fr;}body{padding:20px 10px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>千川全域投放日报</h1>
    <div class="sub" id="subline"></div>
    <div class="datebar" id="datebar"></div>
    <div class="note" id="scopenote"></div>
  </header>

  <!-- 跨日对比 -->
  <section class="board" id="trendBoard">
    <div class="board-hd"><h2><span class="bar"></span>跨日对比</h2></div>
    <div class="tablecard">
      <table class="trend" id="trendTable"></table>
    </div>

  <!-- 板块1：汇总 -->
  <section class="board">

    <div id="summary"></div>
  </section>

  <!-- 板块2：分店铺 -->
  <section class="board">

    </div>
    <div class="tablecard">
      <table id="shopTable">
        <thead><tr>
          <th data-k="shop" class="txt">店铺</th>
          <th data-k="cost">消耗</th>
          <th data-k="roi">ROI</th>
          <th data-k="cc">转化成本</th>
          <th data-k="orders">订单</th>
          <th data-k="gmv">GMV</th>
        </tr></thead>
        <tbody id="shopBody"></tbody>
      </table>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</div>

let curDate = MULTI.defaultDate;
let DATA = MULTI.data[curDate];   // 当前展示日
let SECTIONS = DATA.sections;      // [{key,name}]

const state = { seg:'all', openShops:new Set(), openAccts:new Set(), sortKey:'cost', sortDir:'desc', allOpen:false };

function money(n){ return '¥' + (n||0).toLocaleString('zh-CN',{maximumFractionDigits:2}); }
function money2(n){ return '¥' + (n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(n){ return (n||0).toLocaleString('zh-CN'); }
function roiOf(c,g){ return c>0 ? g/c : 0; }
function ccOf(c,o){ return o>0 ? c/o : 0; }           // 转化成本 = 消耗 ÷ 订单数
function ccText(c){ return c>0 ? money2(c) : '—'; }   // 订单=0 时显示 —，避免误读为 ¥0.00
function arrow(d){ return d>0?'▲':d<0?'▼':'—'; }

// 环比：上涨=红(up)，下降=绿(down)
function cmp(cur, prev){
  if(prev === 0){ return { txt: cur>0?'新增':'—', dir: cur>0?1:0, cls: cur>0?'up':'flat' }; }
  const p = (cur - prev) / prev * 100;
  if(Math.abs(p) < 0.05) return { txt:'持平', dir:0, cls:'flat' };
  const dir = p>0?1:-1;
  return { txt:(p>0?'+':'') + p.toFixed(1) + '%', dir, cls: dir>0?'up':'down' };
}
// 消耗 + 环比（环比放消耗下方）
function costCell(cost, c){
  return `<div class="mval">${money(cost)}</div><div class="mchg ${c.cls}">${arrow(c.dir)} ${c.txt}</div>`;
}

// 按 segment 聚合全部账户（用于汇总卡）
function aggTotals(seg, day){
  let cost=0,gmv=0,orders=0;
  for(const a of DATA.accounts){
    for(const s of SECTIONS){
      if(seg!=='all' && s.key!==seg) continue;
      const x = a.sec[s.key] && a.sec[s.key][day];
      if(x){ cost+=x.cost; gmv+=x.gmv; orders+=x.orders; }
    }
  }
  return { cost, gmv, orders };
}

// 渠道标签
function secTags(keys){
  return (keys||[]).map(k=>{
    const s = SECTIONS.find(x=>x.key===k);
    const cls = k==='live'?'live':k==='brand'?'brand':'';
    return `<span class="tag ${cls}">${s?s.name:''}</span>`;
  }).join('');
}
function secCls(k){ return k==='live'?'live':k==='brand'?'brand':''; }

// ===== 板块1：汇总（横向铺开）=====
function kpi(name, val, chg){
  const sub = chg ? `<div class="mchg ${chg.cls}">${arrow(chg.dir)} ${chg.txt}</div>` : '';
  return `<div class="kpi"><div class="k">${name}</div><div class="mval">${val}</div>${sub}</div>`;
}
function roiCell(roiNow, roiPrev){
  const chg = cmp(roiNow, roiPrev);
  return `<div class="mval">${roiNow.toFixed(2)}</div><div class="mchg ${chg.cls}">${arrow(chg.dir)} ${chg.txt}</div>`;
}
function sumCard(name, cls, d, d1){
  const roiNow = roiOf(d.cost,d.gmv), roiPrev = roiOf(d1.cost,d1.gmv);
  const cc = ccOf(d.cost, d.orders);
  const kpis = [
    kpi('消耗', money(d.cost), cmp(d.cost, d1.cost)),
    kpi('ROI', roiNow.toFixed(2), cmp(roiNow, roiPrev)),
    kpi('转化成本', ccText(cc)),
    kpi('订单数', num(d.orders)),
    kpi('成交金额', money(d.gmv)),
  ].join('');
  const hint = cls.includes('brand') ? `<span class="hint" title="品牌投放 ROI 为千川品牌模块「直接支付 ROI」口径，仅计入即时直接成交，与商品/直播不可直接横向比较">直接ROI</span>` : '';
  return `<div class="sum-card ${cls}">
    <div class="sum-hd"><span class="pin"></span>${name}${hint}</div>
    <div class="kpi-row">${kpis}</div>
  </div>`;
}
function renderSummary(){
  const dAll = aggTotals('all','d'), d1All = aggTotals('all','d1');
  const allCard = sumCard('全部','primary hero', dAll, d1All);
  const chanCards = SECTIONS.map(s=>{
    const d = aggTotals(s.key,'d'), d1 = aggTotals(s.key,'d1');
    return sumCard(s.name, secCls(s.key), d, d1);
  }).join('');
  document.getElementById('summary').innerHTML =
    `<div class="sum-hero">${allCard}</div><div class="sumgrid">${chanCards}</div>`;
}

// ===== 跨日对比（始终并排展示所有日期）=====
function dayTotals(ds){
  const D = MULTI.data[ds];
  let cost=0,gmv=0,orders=0;
  for(const a of D.accounts) for(const s of D.sections){
    const x=a.sec[s.key]&&a.sec[s.key].d;
    if(x){ cost+=x.cost; gmv+=x.gmv; orders+=x.orders; }
  }
  return { cost, gmv, orders, roi: roiOf(cost,gmv), cc: ccOf(cost,orders) };
}
function renderTrend(){
  const ds = MULTI.dates;
  const totals = ds.map(dayTotals);
  const head = '<th class="txt mlabel">指标</th>' + ds.map(d=>{
    const f=fmtDate(d);
    const cur = d===curDate ? ' style="color:var(--blue)"' : '';
    return `<th class="txt"${cur}>${f.md} ${f.wk}</th>`;
  }).join('');
  const defs = [
    { name:'消耗',     fmt:t=>money(t.cost),     num:t=>t.cost, chg:true },
    { name:'ROI',      fmt:t=>t.roi.toFixed(2),  num:t=>t.roi,  chg:true },
    { name:'转化成本', fmt:t=>ccText(t.cc),      num:t=>t.cc,   chg:false },
    { name:'订单数',   fmt:t=>num(t.orders),     num:t=>t.orders, chg:false },
    { name:'成交金额', fmt:t=>money(t.gmv),      num:t=>t.gmv,  chg:false },
  ];
  const body = defs.map(def=>{
    const cells = ds.map((d,i)=>{
      const t = totals[i];
      let inner = `<div class="mval">${def.fmt(t)}</div>`;
      if(def.chg && i>0){
        const c = cmp(def.num(t), def.num(totals[i-1]));
        inner += `<div class="mchg ${c.cls}">${arrow(c.dir)} ${c.txt}</div>`;
      }
      const cur = d===curDate ? ' class="curcol"' : '';
      return `<td class="txt"${cur}>${inner}</td>`;
    }).join('');
    return `<tr><td class="txt mlabel">${def.name}</td>${cells}</tr>`;
  }).join('');
  document.getElementById('trendTable').innerHTML =
    `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
}

// ===== 板块2：分店铺 =====
function shopAgg(seg){
  const map = {};
  for(const a of DATA.accounts){
    let has=false;
    for(const s of SECTIONS){ if(seg!=='all'&&s.key!==seg) continue; const x=a.sec[s.key]&&a.sec[s.key].d; if(x&&x.cost>0) has=true; }
    if(!has) continue;
    const shop = a.shop || '未匹配店铺';
    if(!map[shop]) map[shop] = { shop, cost:0, cost1:0, gmv:0, gmv1:0, orders:0, secs:new Set() };
    const m = map[shop];
    for(const s of SECTIONS){
      if(seg!=='all'&&s.key!==seg) continue;
      const x=a.sec[s.key]&&a.sec[s.key].d, x1=a.sec[s.key]&&a.sec[s.key].d1;
      if(x){ m.cost+=x.cost; m.gmv+=x.gmv; m.orders+=x.orders; m.secs.add(s.key); }
      if(x1){ m.cost1+=x1.cost; m.gmv1+=x1.gmv; }
    }
  }
  let rows = Object.values(map);
  const dir = state.sortDir==='asc'?1:-1, k = state.sortKey;
  rows.sort((x,y)=>{
    if(k==='shop') return x.shop<y.shop?-dir:x.shop>y.shop?dir:0;
    let xv,yv;
    if(k==='roi'){ xv=roiOf(x.cost,x.gmv); yv=roiOf(y.cost,y.gmv); }
    else if(k==='cc'){ xv=ccOf(x.cost,x.orders); yv=ccOf(y.cost,y.orders); }
    else if(k==='share'){ xv=x.cost; yv=y.cost; }
    else { xv=x[k]; yv=y[k]; }
    return (xv-yv)*dir;
  });
  rows.forEach(r=> r.secs = [...r.secs]);
  return rows;
}

function acctsOfShop(shop, seg){
  return DATA.accounts.filter(a=>{
    if((a.shop||'未匹配店铺')!==shop) return false;
    for(const s of SECTIONS){ if(seg!=='all'&&s.key!==seg) continue; const x=a.sec[s.key]&&a.sec[s.key].d; if(x&&x.cost>0) return true; }
    return false;
  }).map(a=>{
    let cost=0,cost1=0,gmv=0,gmv1=0,orders=0; const activeSecs=[];
    for(const s of SECTIONS){
      if(seg!=='all'&&s.key!==seg) continue;
      const x=a.sec[s.key]&&a.sec[s.key].d, x1=a.sec[s.key]&&a.sec[s.key].d1;
      if(x&&x.cost>0){ cost+=x.cost; gmv+=x.gmv; orders+=x.orders; activeSecs.push(s.key); }
      if(x1){ cost1+=x1.cost; gmv1+=x1.gmv; }
    }
    return { id:a.id, name:a.name, cost, cost1, gmv, gmv1, orders, activeSecs };
  }).sort((x,y)=>y.cost-x.cost);
}

function secDetail(id){
  const full = DATA.accounts.find(x=>x.id===id);
  return SECTIONS.map(s=>{
    const x = full.sec[s.key] && full.sec[s.key].d;
    if(!x || x.cost<=0) return '';
    const x1 = full.sec[s.key] && full.sec[s.key].d1;
    const chg = cmp(x.cost, x1?x1.cost:0);
    const roiNow = roiOf(x.cost,x.gmv), roiPrev = x1?roiOf(x1.cost,x1.gmv):0;
    const cc = ccOf(x.cost,x.orders);
    return `<tr class="sec-row">
      <td class="txt"><span class="tag ${secCls(s.key)}">${s.name}</span></td>
      <td>${costCell(x.cost,chg)}</td>
      <td>${roiCell(roiNow, roiPrev)}</td>
      <td>${ccText(cc)}</td>
      <td>${num(x.orders)}</td>
      <td>${money(x.gmv)}</td>
    </tr>`;
  }).join('');
}

function acctDetail(shop, seg){
  const accts = acctsOfShop(shop, seg);
  const rows = accts.map(a=>{
    const chg = cmp(a.cost, a.cost1);
    const roiNow = roiOf(a.cost,a.gmv), roiPrev = roiOf(a.cost1,a.gmv1), cc = ccOf(a.cost,a.orders);
    const expandable = a.activeSecs.length>1;
    const aopen = state.openAccts.has(a.id);
    const chev = expandable ? `<span class="chev">▸</span>` : '';
    const secRows = (expandable && aopen) ? secDetail(a.id) : '';
    return `<tr class="acct-row${expandable?' expandable':''}${aopen?' open':''}" data-acct="${a.id}">
      <td class="txt">${chev}<span class="acct-cell"><span class="acct-name">${a.name}</span><span class="acct-tags">${secTags(a.activeSecs)}</span></span></td>
      <td>${costCell(a.cost,chg)}</td>
      <td>${roiCell(roiNow, roiPrev)}</td>
      <td>${ccText(cc)}</td>
      <td>${num(a.orders)}</td>
      <td>${money(a.gmv)}</td>
    </tr>${secRows}`;
  }).join('');
  return `<tr class="detail-row"><td colspan="6"><div class="detail-inner">
    <table class="detail-tbl"><thead><tr>
      <th class="txt">账户名称</th><th>消耗</th><th>ROI</th><th>转化成本</th><th>订单</th><th>GMV</th>
    </tr></thead><tbody>${rows}</tbody></table></div></td></tr>`;
}

function renderShops(){
  const seg = state.seg;
  const rows = shopAgg(seg);
  document.getElementById('shopBody').innerHTML = rows.map(m=>{
    const chg = cmp(m.cost, m.cost1);
    const roiNow = roiOf(m.cost,m.gmv), roiPrev = roiOf(m.cost1,m.gmv1), cc = ccOf(m.cost,m.orders);
    const open = state.openShops.has(m.shop);
    return `<tr class="shop-row${open?' open':''}" data-shop="${encodeURIComponent(m.shop)}">
      <td class="txt"><span class="chev">▸</span><div class="shop-cell"><div class="shop-name">${m.shop}</div><div class="shop-tags">${secTags(m.secs)}</div></div></td>
      <td>${costCell(m.cost,chg)}</td>
      <td>${roiCell(roiNow, roiPrev)}</td>
      <td>${ccText(cc)}</td>
      <td>${num(m.orders)}</td>
      <td>${money(m.gmv)}</td>
    </tr>${open?acctDetail(m.shop,seg):''}`;
  }).join('') + (rows.length? totalRow(rows) : '');
}
function totalRow(rows){
  const t = rows.reduce((s,m)=>({cost:s.cost+m.cost, gmv:s.gmv+m.gmv, orders:s.orders+m.orders, cost1:s.cost1+m.cost1, gmv1:s.gmv1+m.gmv1}), {cost:0,gmv:0,orders:0,cost1:0,gmv1:0});
  const tchg = cmp(t.cost, t.cost1);
  const tRoi = roiOf(t.cost,t.gmv), tRoiPrev = roiOf(t.cost1,t.gmv1);
  const tcc = ccOf(t.cost,t.orders);
  return `<tr class="total-row">
    <td class="txt">合计（${rows.length} 个店铺）</td>
    <td>${costCell(t.cost, tchg)}</td>
    <td>${roiCell(tRoi, tRoiPrev)}</td>
    <td>${ccText(tcc)}</td>
    <td>${num(t.orders)}</td>
    <td>${money(t.gmv)}</td>
  </tr>`;
}

function renderSeg(){
  const tabs = [{key:'all',name:'全部'}].concat(SECTIONS.map(s=>({key:s.key,name:s.name})));
  document.getElementById('segbtns').innerHTML = tabs.map(t=>
    `<button class="seg ${state.seg===t.key?'active':''}" data-k="${t.key}">${t.name}</button>`).join('');
}
function updateBatchText(){
  document.getElementById('batchBtn').textContent = state.allOpen ? '全部折叠 ▴' : '全部展开 ▾';
}

// ===== 顶部日期选择 =====
const WK = ['周日','周一','周二','周三','周四','周五','周六'];
function fmtDate(ds){
  const dt = new Date(ds + 'T00:00:00+08:00');
  const mm = String(dt.getMonth()+1).padStart(2,'0'), dd = String(dt.getDate()).padStart(2,'0');
  return { md: `${mm}-${dd}`, wk: WK[dt.getDay()] };
}
function renderDatebar(){
  const btns = MULTI.dates.map(ds=>{
    const f = fmtDate(ds);
    return `<button class="date-btn ${ds===curDate?'active':''}" data-d="${ds}">
      <span class="dnum">${f.md}</span><span class="dwk">${f.wk}</span></button>`;
  }).join('');
  document.getElementById('datebar').innerHTML =
    `<span class="dlabel"><span class="cal"></span>选择日期</span><div class="date-group">${btns}</div>`;
}
function switchDate(ds){
  if(ds===curDate || !MULTI.data[ds]) return;
  curDate = ds;
  DATA = MULTI.data[ds];
  SECTIONS = DATA.sections;
  // 切日期重置展开态，保留分段与排序
  state.openShops.clear(); state.openAccts.clear(); state.allOpen=false;
  renderAll();
}

function renderSub(){
  document.getElementById('subline').textContent = `报告日 ${DATA.date} ｜ 环比对比前一日（${DATA.compare.dod}）`;
  document.getElementById('scopenote').textContent =
    '覆盖「商品投放 + 直播投放 + 品牌投放」三板块。仅含当日有消耗账户；转化成本 = 消耗 ÷ 订单数；环比涨=红 / 跌=绿。';
  document.getElementById('foot').innerHTML =
    '数据来源：巨量引擎千川「全域投放」（商品投放 + 直播投放） + 千川「品牌投放」｜ 仅含当日有消耗账户 ｜ 转化成本 = 消耗 ÷ 订单数 ｜ 环比涨=红 / 跌=绿<br>' +
    '注：品牌投放 ROI 为千川品牌模块「直接支付 ROI」口径，仅计入即时直接成交，与商品/直播 ROI 不在同一统计口径，不可直接横向比较。<br>' +
    '报表由 WorkBuddy 自动生成';
}

// ===== 事件绑定（一次性，委托到持久容器）=====
function bindOnce(){
  // 顶部日期选择（委托）
  document.getElementById('datebar').addEventListener('click', e=>{
    const b = e.target.closest('.date-btn'); if(!b) return;
    switchDate(b.dataset.d);
  });
  // 分段按钮
  document.getElementById('segbtns').addEventListener('click', e=>{
    const b = e.target.closest('.seg'); if(!b) return;
    state.seg = b.dataset.k; state.openShops.clear(); state.openAccts.clear(); state.allOpen=false;
    renderSeg(); renderShops(); updateBatchText();
  });
  // 批量展开/折叠
  document.getElementById('batchBtn').addEventListener('click', ()=>{
    const rows = shopAgg(state.seg);
    if(state.allOpen){ state.openShops.clear(); state.allOpen=false; }
    else { rows.forEach(m=>state.openShops.add(m.shop)); state.allOpen=true; }
    renderShops(); updateBatchText();
  });
  // 店铺 / 账户 展开（委托）
  document.getElementById('shopBody').addEventListener('click', e=>{
    const acct = e.target.closest('.acct-row.expandable');
    if(acct){
      const id = acct.dataset.acct;
      state.openAccts.has(id) ? state.openAccts.delete(id) : state.openAccts.add(id);
      renderShops(); return;
    }
    const shop = e.target.closest('.shop-row');
    if(shop){
      const s = decodeURIComponent(shop.dataset.shop);
      state.openShops.has(s) ? state.openShops.delete(s) : state.openShops.add(s);
      state.allOpen = false; renderShops(); updateBatchText(); return;
    }
  });
  // 排序
  document.querySelectorAll('#shopTable thead th[data-k]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.k;
      if(state.sortKey===k) state.sortDir = state.sortDir==='asc'?'desc':'asc';
      else { state.sortKey=k; state.sortDir = (k==='shop')?'asc':'desc'; }
      renderShops();
    });
  });
}

function renderAll(){ renderDatebar(); renderSub(); renderTrend(); renderSummary(); renderSeg(); renderShops(); updateBatchText(); }
renderAll();
bindOnce();
</script>
</body>
