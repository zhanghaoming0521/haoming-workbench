<style>
:root{--bg:#f5f7fa;--card:#fff;--line:#ebeef5;--text:#1f2329;--sub:#8a9099;--up:#e34d59;--down:#2ba471;--brand:#3b6cff;--chip:#eef2ff;--rate:#7a5cff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:0 0 40px;max-width:920px;margin:0 auto;font-size:14px}
header{padding:16px 16px 8px}
h1{font-size:20px;font-weight:700}
.sub{color:var(--sub);font-size:13px;margin-top:4px}
.legend{font-size:12px;color:var(--sub);margin-top:6px}
.legend .up{color:var(--up)}.legend .down{color:var(--down)}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
.nav a{flex:0 0 auto;text-decoration:none;color:var(--text);background:var(--chip);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--brand);color:#fff}
.shop-tip{display:none;position:fixed;z-index:9999;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px;min-width:320px;max-height:74vh;overflow:auto;font-size:13px}
.shop-tip .tip-h{font-weight:700;margin-bottom:8px;font-size:13px;color:var(--text)}
.shop-tip .tip-tb{border-collapse:collapse;width:100%}
.shop-tip .tip-tb th{text-align:left;color:var(--sub);font-weight:600;font-size:12px;padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.shop-tip .tip-tb td{padding:5px 10px;border-bottom:1px solid #f2f4f8;white-space:nowrap;font-size:13px}
.shop-tip .tip-tb tr:last-child td{border-bottom:none}
.tip-ico{font-size:11px;color:var(--brand);margin-left:5px;font-style:normal}
section{background:var(--card);border-radius:12px;padding:14px;margin:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sec-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-title .bar{width:4px;height:16px;background:var(--brand);border-radius:2px}
.m1-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.m1-card{border:1px solid var(--line);border-radius:10px;padding:12px}
.m1-card .lab{font-size:12px;color:var(--sub)}.m1-card .val{font-size:19px;font-weight:700;margin-top:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--chip);border:none;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.chip.active{background:var(--brand);color:#fff}
.metrics{display:flex;flex-wrap:wrap;gap:10px}
.mb{display:flex;flex-direction:column;min-width:62px}
.mb .ml{font-size:11px;color:var(--sub)}
.mb b{font-size:14px;font-weight:700}
.delta{font-size:11px;font-weight:700}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.none{color:var(--sub)}.delta.new{color:var(--brand)}
.scroll{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:4px}
.search-wrap{margin:0 0 10px}
.search{width:100%;box-sizing:border-box;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--text);outline:none}
.search:focus{border-color:var(--brand)}
.search-wrap .hint{font-size:11px;color:var(--sub);margin-top:4px}
.flab{font-size:12px;color:var(--sub);align-self:center}
.row{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.row .left{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.row .left img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#f0f0f0;flex-shrink:0}
.img-ph{width:44px;height:44px;border-radius:8px;background:var(--chip);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.row .txt{min-width:0;overflow:hidden}

.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.row .metrics{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.rate-line{font-size:12px;color:var(--sub);text-align:right}

.rate-line .delta{color:var(--rate)}
.shop{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.shop-head{padding:10px 12px;cursor:pointer;background:#fafbfc;display:flex;gap:10px;align-items:center}
.shop-head.noclick{cursor:default}
.shop-name{font-weight:700;font-size:15px;flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.shop-head .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.shop-body{display:none;border-top:1px solid var(--line)}
.shop.open .shop-body{display:block}
</style>
<style>

.diag-row .note{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
.diag-row .diag-cat{font-size:12px;color:var(--sub);margin-top:2px}

.diag-alert.diag-warn{border-left-color:#d48806;background:#fffbe6}
</style>

function money(x){return '¥'+Math.round(x).toLocaleString('en-US');}
function num(x){return Math.round(x).toLocaleString('en-US');}
function rawnum(x){return Math.round(x).toString();}
function pct1(x){return (x*100).toFixed(1)+'%';}
function dHTML(m){
  if(!m) return '<span class="delta none">—</span>';
  if(m.t==='pct'||m.t==='pp'){
    if(m.d===null||m.d===undefined) return '<span class="delta none">—</span>';
    var up=m.d>0, cls=up?'up':'down', ar=up?'▲':'▼', u=m.t==='pp'?'pp':'%';
    return '<span class="delta '+cls+'">'+ar+Math.abs(m.d).toFixed(1)+u+'</span>';
  }
  if(m.t==='new') return '<span class="delta new">新</span>';
  return '<span class="delta none">—</span>';
}
function mb(label,m,isMoney){
  return '<div class="mb"><span class="ml">'+label+'</span><b>'+(isMoney?money(m.c):num(m.c))+'</b>'+dHTML(m)+'</div>';
}
function rateLine(m){
  return '<div class="rate-line">售前退货率 <b>'+pct1(m.c)+'</b> '+dHTML(m)+'</div>';
}
function imgErr(el,no){
  el.outerHTML='<div class="img-ph">'+(no?no.slice(0,4):'?')+'</div>';
}

function m1(){
  var s=DATA.summary;
  var cards=[
    {l:'销售金额',v:money(s.salesAmount.c),m:s.salesAmount},
    {l:'销售数量',v:num(s.salesQty.c),m:s.salesQty},
    {l:'净销售额',v:money(s.netAmount.c),m:s.netAmount},
    {l:'净销量',v:num(s.netQty.c),m:s.netQty},
    {l:'售前退货率',v:pct1(s.preReturn.c),m:s.preReturn},
  ];
  var h='<div class="m1-grid">';
  cards.forEach(function(c){h+='<div class="m1-card"><div class="lab">'+c.l+'</div><div class="val">'+c.v+'</div><div class="delta">'+dHTML(c.m)+'</div></div>';});
  h+='</div>';
  document.getElementById('m1b').innerHTML=h;
}
function m2(){
  if(!window.SHOP_MAP){ window.SHOP_MAP={}; DATA.byStyle.forEach(function(r){ window.SHOP_MAP[r.code]=r.shops||[]; }); }
  function showShopTip(e, code){
    var list = window.SHOP_MAP[code] || [];
    if(!list.length){ return; }
    var h='<div class="tip-h">'+code+' · 各店铺销售分布（按件数占比）</div>';
    h+='<table class="tip-tb"><thead><tr><th>店铺</th><th>件数</th><th>净销售额</th><th>件数占比</th></tr></thead><tbody>';
    list.forEach(function(s){
      h+='<tr><td>'+s.shop+'</td><td>'+num(s.sq)+'</td><td>'+money(s.na)+'</td><td>'+pct1(s.pct)+'</td></tr>';
    });
    h+='</tbody></table>';
    var tip=document.getElementById('shoptip');
    if(!tip){ tip=document.createElement('div'); tip.id='shoptip'; tip.className='shop-tip'; document.body.appendChild(tip); }
    tip.innerHTML=h; tip.style.display='block';
    var tw=tip.offsetWidth, th=tip.offsetHeight;
    var px=e.clientX+14, py=e.clientY+14;
    if(px+tw>window.innerWidth) px=e.clientX-tw-14;
    if(py+th>window.innerHeight) py=e.clientY-th-14;
    tip.style.left=px+'px'; tip.style.top=py+'px';
  }
  function hideShopTip(){ var tip=document.getElementById('shoptip'); if(tip) tip.style.display='none'; }
  state.search=state.search||'';

    var sec=document.getElementById('m2');

    sec.insertBefore(box, document.getElementById('m2b'));
  }
  var cats=['全部'].concat(DATA.categories);
  var f='<div class="filters">';
  cats.forEach(function(c){f+='<button class="chip'+(state.cat===c?' active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</button>';});
  f+='</div>';
  var kw=(state.search||'').trim().toLowerCase();

  else { rows.forEach(function(r){
    h+='<div class="row"><div class="left">'+

       '<div class="txt"><div class="code" data-code="'+r.code+'">'+r.code+'<i class="tip-ico">ⓘ</i></div>'+
       (r.cat?'<div class="cat">'+r.cat+'</div>':'')+'</div></div>'+
       '<div class="right"><div class="metrics">'+mb('销售金额',r.sa,true)+mb('销售数量',r.sq,false)+mb('净销售额',r.na,true)+mb('净销量',r.nq,false)+'</div>'+
       rateLine(r.pre)+'</div></div>';
  }); }
  h+='</div></div>';
  document.getElementById('m2b').innerHTML=f+h;

    var code=el.getAttribute('data-code');

    el.addEventListener('mouseleave', function(){ hideShopTip(); });
  });

  h+='</div>';
  h+=diagRankBlock('店铺涨跌榜', D.shopUp, D.shopDown, false);
  h+=diagRankBlock('商品涨跌榜', D.styleUp, D.styleDown, true);
  document.getElementById('m4b').innerHTML=h;
}
function diagRankBlock(title, up, down, withImg){
  var h='<div class="diag-block"><div class="diag-h">'+title+'</div>';
  h+='<div class="diag-sub">▲ 涨最多</div>'+diagRows(up,withImg);
  h+='<div class="diag-sub">▼ 掉最多</div>'+diagRows(down,withImg);
  h+='</div>'; return h;
}
function diagRows(rows, withImg){
  if(!rows||!rows.length) return '<div class="diag-note">— 无</div>';
  var h='';
  rows.forEach(function(r){
    var img = withImg ? '<img src="'+(r.img||'')+'" referrerpolicy="no-referrer" onerror="imgErr(this)">' : '';
    var sub = r.cat ? '<div class="diag-cat">'+r.cat+'</div>' : '';
    h+='<div class="diag-row diag-'+r.cls+'">'+img+'<div class="diag-info"><div class="nm">'+r.name+sub+'</div><div class="note">'+r.note+'</div></div>'+
       '<div class="mt"><div class="mm">金额<b>'+money(r.sa.c)+'</b>'+dHTML(r.sa)+'</div>'+
       '<div class="mm">销量<b>'+num(r.sq.c)+'</b>'+dHTML(r.sq)+'</div></div></div>';
  });
  return h;
}

m1();m2();m3();m4();
</script>
